name: Provision Consumer account

on:
  workflow_dispatch:
    inputs:
      firebase_uid:
        description: Exact Firebase Authentication UID
        required: true
        type: string
      expected_email:
        description: Exact email expected for this UID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: provision-consumer-${{ inputs.firebase_uid }}
  cancel-in-progress: false

jobs:
  provision:
    name: Activate one verified Consumer account
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: consumer-account-provisioning

    steps:
      - name: Authenticate to Google Cloud without a key
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/397025942439/locations/global/workloadIdentityPools/github-gabo-platform/providers/trusted-repositories
          service_account: github-consumer-dev@gabo-service.iam.gserviceaccount.com
          token_format: access_token
          create_credentials_file: false

      - name: Validate and activate Consumer identity
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FIREBASE_UID: ${{ inputs.firebase_uid }}
          EXPECTED_EMAIL: ${{ inputs.expected_email }}
          FIREBASE_PROJECT_ID: gabo-service
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${FIREBASE_UID}" =~ ^[A-Za-z0-9_-]{20,128}$ ]]; then
            echo "The Firebase UID format is invalid." >&2
            exit 1
          fi

          normalized_email="$(printf '%s' "${EXPECTED_EMAIL}" | tr '[:upper:]' '[:lower:]')"
          lookup_payload="$(jq -cn --arg uid "${FIREBASE_UID}" '{localId:[$uid]}')"
          lookup_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${lookup_payload}" \
            "https://identitytoolkit.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/accounts:lookup")"

          user_count="$(jq '.users | length' <<<"${lookup_response}")"
          if [[ "${user_count}" -ne 1 ]]; then
            echo "The exact Firebase UID was not found." >&2
            exit 1
          fi

          actual_email="$(jq -r '.users[0].email // "" | ascii_downcase' <<<"${lookup_response}")"
          email_verified="$(jq -r '.users[0].emailVerified // false' <<<"${lookup_response}")"
          disabled="$(jq -r '.users[0].disabled // false' <<<"${lookup_response}")"

          if [[ "${actual_email}" != "${normalized_email}" ]]; then
            echo "The expected email does not match the Firebase UID." >&2
            exit 1
          fi
          if [[ "${email_verified}" != "true" ]]; then
            echo "The Firebase email must be verified before activation." >&2
            exit 1
          fi
          if [[ "${disabled}" == "true" ]]; then
            echo "The Firebase account is disabled." >&2
            exit 1
          fi

          current_claims="$(jq -r '.users[0].customAttributes // "{}"' <<<"${lookup_response}")"
          merged_claims="$(jq -cn --argjson current "${current_claims}" \
            '$current + {account_type:"consumer",account_status:"active"}')"
          update_payload="$(jq -cn \
            --arg uid "${FIREBASE_UID}" \
            --arg claims "${merged_claims}" \
            '{localId:$uid,customAttributes:$claims}')"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GOOGLE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "${update_payload}" \
            "https://identitytoolkit.googleapis.com/v1/projects/${FIREBASE_PROJECT_ID}/accounts:update" \
            >/dev/null

          echo "PASS: verified Consumer account activated for the exact Firebase UID."
